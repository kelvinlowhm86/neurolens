# NeuroLens GPU worker — exact pins, taken from the venv that ran TRIBE v2 successfully
# (/home/kelvinlow/projects/venv, Python 3.11, torch 2.6.0+cu126, 2026-10-27).
# Install:  pip install --no-deps -r worker/requirements.lock --extra-index-url https://download.pytorch.org/whl/cu126
# --no-deps is deliberate: the working venv runs whisperx / pyannote (which declare torch 2.8 and
# huggingface-hub<1) on torch 2.6 + huggingface-hub 1.15 — pip's resolver would refuse that combination,
# so we reproduce the proven set exactly instead. flash_attn is left out (source build; TRIBE doesn't use it).
# The CUDA runtime comes from the pinned nvidia-* wheels below; only the host NVIDIA driver is needed.
