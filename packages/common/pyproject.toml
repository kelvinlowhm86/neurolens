[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolens-common"
version = "0.1.0"
description = "Shared config, database, billing and job rules for the NeuroLens web tier and GPU worker"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["neurolens_common*"]
