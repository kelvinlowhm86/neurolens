<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>NeuroLens – Slides</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Fonts match the NeuroLens website -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* === THEME (same tokens as the NeuroLens site) === */
:root{--bg:#0B0C0E;--line:#262A31;--text:#E8EAED;--muted:#8B929C;--accent:#FF8A2A;--accent-2:#FFC24A;
--display:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
--ease:cubic-bezier(.2,.7,.2,1);--stage-bg:#000;--slide-bg:#0B0C0E}
*{margin:0;padding:0;box-sizing:border-box}

/* === FIXED 16:9 STAGE (viewport-base.css from the frontend-slides skill) === */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}
.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls,#scan,#hud{display:none!important}.reveal{opacity:1!important;transform:none!important;transition:none!important}.draw{stroke-dashoffset:0!important;animation:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

/* === SLIDE BASE === */
.slide{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;color:var(--text);font-family:var(--display)}
.pad{position:absolute;left:140px;right:140px;top:130px;bottom:120px;display:flex;flex-direction:column}
.kicker{position:absolute;left:140px;top:64px;font:500 24px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who{position:absolute;right:140px;top:64px;font:500 24px var(--mono);letter-spacing:.08em;color:var(--accent)}
.pgn{position:absolute;right:140px;bottom:56px;font:500 22px var(--mono);color:var(--muted)}
h1{font-weight:600;font-size:92px;line-height:1.04;letter-spacing:-.035em;max-width:1560px}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:38px;line-height:1.35;color:var(--muted);margin-top:28px;max-width:1380px}
.mono{font:500 22px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fill{flex:1;display:flex;flex-direction:column;justify-content:center}
.hl{color:var(--accent)}.hl2{color:var(--accent-2)}

/* === MOTION: slide wipe copied from the site; one fade-up for content === */
@keyframes wipe-in{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes wipe-out{to{opacity:.0;transform:scale(.99)}}
.slide.active.go{animation:wipe-in .35s var(--ease) both}
.slide.leaving{visibility:visible;opacity:1;z-index:0;animation:wipe-out .35s var(--ease) both}
#scan{position:absolute;left:0;top:0;bottom:0;width:3px;z-index:50;pointer-events:none;opacity:0;background:linear-gradient(180deg,transparent,#FF8A2A 20%,#FFC24A 50%,#FF8A2A 80%,transparent);box-shadow:0 0 20px 3px rgba(255,138,42,.5)}
#scan.go{animation:scan .35s var(--ease) both}
@keyframes scan{from{transform:translateX(-3px);opacity:1}85%{opacity:1}to{transform:translateX(1917px);opacity:0}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--d,0)*120ms)}
.slide.active .reveal{opacity:1;transform:none;transition-delay:calc(.25s + var(--d,0)*120ms)}
.slide.leaving .reveal{opacity:1;transform:none;transition:none}
.draw{fill:none;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .draw{animation:draw 2.2s cubic-bezier(.65,0,.35,1) .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* === TITLE === */
.title .pad{justify-content:center}
.title h1{font-size:230px;letter-spacing:-.05em;line-height:.95}
.title .tag{font-size:64px;margin-top:20px;font-weight:400}
.title .curve{position:absolute;left:0;right:0;bottom:90px;width:1920px;height:220px;opacity:.9}

/* === PROBLEM: one number, three rows === */
.big{font-size:300px;font-weight:600;letter-spacing:-.05em;line-height:.9;color:var(--accent)}
.rows{width:100%}.rows .r{display:grid;grid-template-columns:280px 290px 1fr;align-items:baseline;gap:24px;border-top:1px solid var(--line);padding:26px 0;font-size:38px}
.rows .r span:nth-child(2){font-weight:600}.rows .r span:nth-child(3){color:var(--muted);font-size:32px;text-align:right}
.rows .r.us{color:var(--accent-2)}
.src{font:22px var(--mono);color:var(--muted);margin-top:26px;max-width:1500px}

/* === LAYOUT HELPERS === */
.cols{display:grid;gap:120px}.cols.c2{grid-template-columns:1fr 1fr}.cols.c3{grid-template-columns:1fr 1fr 1fr}
.cols h2{font-size:72px;font-weight:600;letter-spacing:-.03em;line-height:1.05}.cols p{font-size:34px;line-height:1.4;color:var(--muted);margin-top:22px}
.cols .q{font-size:60px;line-height:1.12;font-weight:500;letter-spacing:-.025em}.cols .q:before{content:"“";color:var(--accent)}.cols .q:after{content:"”";color:var(--accent)}

/* === FLOW (Idea, Journey) === */
.flow{display:grid;gap:0;position:relative}
.flow .n{position:relative;padding-top:44px;border-top:2px solid var(--line)}
.flow .n:before{content:"";position:absolute;left:0;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.flow .n b{display:block;font-size:50px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.flow .n span{display:block;font-size:30px;color:var(--muted);margin-top:14px;line-height:1.35;padding-right:30px}
.flow .n i{font:500 22px var(--mono);font-style:normal;color:var(--accent);display:block;margin-bottom:14px}

/* === DEMO SCREENS === */
.shot{position:absolute;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.55);border-radius:4px;overflow:hidden}
.shot img{display:block;width:100%}
.cap{position:absolute;font:500 22px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cues{position:absolute;right:140px;top:250px;width:330px;font-size:34px;line-height:1.35}
.cues li{list-style:none;margin-bottom:34px;padding-left:46px;position:relative}
.cues li b{position:absolute;left:0;top:0;font:500 24px var(--mono);color:var(--accent);margin-top:6px}
.live{display:inline-flex;align-items:center;gap:12px;color:var(--accent);letter-spacing:.1em}
.live:before{content:"";width:14px;height:14px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.25}}

/* === GPU STRIP === */
.strip{margin-top:70px}
.strip .row{display:grid;grid-template-columns:230px 1fr;align-items:center;margin-bottom:34px}
.strip .lab{font:500 24px var(--mono);color:var(--muted);text-transform:uppercase}
.strip .track{position:relative;height:56px;background:rgba(255,255,255,.04);border-radius:4px}
.strip .on{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform .9s var(--ease)}
.strip .tail{position:absolute;top:0;bottom:0;background:var(--accent-2);opacity:.55;border-radius:0 4px 4px 0}
.slide.active .strip .on{transform:scaleX(1);transition-delay:calc(.6s + var(--d)*.25s)}
.strip .own{position:absolute;inset:0;background:#2a2f38;border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.slide.active .strip .own{transform:scaleX(1);transition-delay:.5s}
.axis{display:grid;grid-template-columns:230px 1fr;font:22px var(--mono);color:var(--muted)}.axis div{display:flex;justify-content:space-between}

/* === TEXT LIST === */
.list li{list-style:none;font-size:46px;line-height:1.3;padding:18px 0 18px 64px;position:relative;border-top:1px solid var(--line)}
.list li:before{content:"";position:absolute;left:0;top:44px;width:20px;height:3px;background:var(--accent)}
.list.no li:before{background:var(--muted)}.list li small{font-size:30px;color:var(--muted);margin-left:14px}
.cost .r{display:grid;grid-template-columns:1fr 280px;border-top:1px solid var(--line);padding:22px 0;font-size:40px}
.cost .r span:last-child{text-align:right;font-family:var(--mono);color:var(--muted)}
.cost .r.t{color:var(--accent-2);font-weight:600}
.pending{font:500 26px var(--mono);fill:var(--muted);text-transform:uppercase}
.chart text{font-family:var(--mono)}.chart .tx{font-size:22px;fill:var(--muted)}.chart .tx2{font-size:26px;fill:var(--text)}
.chart .ax{stroke:var(--line);stroke-width:2}
.lg{display:flex;gap:40px;font:500 22px var(--mono);color:var(--muted);text-transform:uppercase;margin-top:18px}.lg i{display:inline-block;width:18px;height:18px;border-radius:3px;margin-right:12px;vertical-align:-2px}
.stat{font-size:200px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--accent)}.stat small{font-size:60px;color:var(--muted);font-weight:400;letter-spacing:0}
.dots{display:flex;gap:22px;margin:30px 0}.dots i{width:56px;height:56px;border-radius:50%;border:3px solid var(--line)}.dots i.f{background:var(--accent);border-color:var(--accent)}

/* === SPEAKER HUD (not part of the slides) === */
#hud{position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:#000e;border-top:2px solid var(--accent);color:var(--text);font:19px/1.5 var(--display);padding:14px 32px;z-index:99;display:none}
body.notes #hud{display:block}#hud .m{font:500 13px var(--mono);color:var(--accent);margin-right:10px}
#clock{position:fixed;top:8px;left:12px;font:12px var(--mono);color:var(--muted);z-index:99;display:none}body.notes #clock{display:block}
template{display:none}
</style></head><body>
<div class="deck-viewport"><main class="deck-stage" id="stage">
%%SLIDES%%
<div id="scan"></div></main></div>
<div id="clock"></div><div id="hud"></div>
<script>
/* === DATA (edit in gen.py; null = results pending) === */
const DATA=%%DATA%%;
const NS='http://www.w3.org/2000/svg',$=(s,r=document)=>r.querySelector(s);
const el=(t,a={},x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;return e};
const stage=$('#stage'),S=[...stage.querySelectorAll('.slide')],hud=$('#hud'),scan=$('#scan'),clock=$('#clock');
let i=Math.max(0,+(location.hash.slice(1)||1)-1),t0=null;

/* === STAGE SCALE === */
function fit(){const f=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`}

/* === CHARTS (simple, built from DATA) === */
const VIZ={
 latency(s){const h=$('.vz',s);h.innerHTML='';const L=DATA.latency,W=1640,H=560,v=L.values,svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  svg.append(el('line',{x1:60,y1:H-60,x2:W,y2:H-60,class:'ax'}));
  const col=['#FF8A2A','#FFC24A','#E8EAED','#8B929C','#4a515c'],tot=v.map(a=>a.reduce((x,y)=>x+y,0)),mx=Math.max(...tot)*1.12,gap=W/(L.labels.length+1);
  L.labels.forEach((c,k)=>{const cx=gap*(k+1)+30,x=cx-110;svg.append(el('text',{x:cx,y:H-20,class:'tx2','text-anchor':'middle'},c));
   let y=H-60;v[k].forEach((p,j)=>{const hh=p/mx*(H-130);y-=hh;svg.append(el('rect',{x,y,width:220,height:hh,fill:col[j]}))});svg.append(el('text',{x:cx,y:y-14,class:'tx2','text-anchor':'middle'},tot[k].toFixed(0)+' s'))});
  h.append(svg);$('.lg',s).innerHTML=L.stages.map((n,j)=>`<span><i style="background:${col[j]}"></i>${n}</span>`).join('')},
 scaling(s){const h=$('.vz',s);h.innerHTML='';const D=DATA.scaling,W=1640,H=560,svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  const x0=100,x1=W-100,y0=H-60,y1=50,X=k=>x0+(x1-x0)*k/(D.labels.length-1);
  svg.append(el('line',{x1:x0,y1:y0,x2:x1+40,y2:y0,class:'ax'}));
  D.labels.forEach((b,k)=>svg.append(el('text',{x:X(k),y:H-16,class:'tx2','text-anchor':'middle'},b)));
  const mx=Math.max(...D.aws,...D.onprem.filter(x=>x!=null))*1.1,Y=y=>y0-(y/mx)*(y0-y1);
  [[D.aws,'#FF8A2A'],[D.onprem,'#8B929C']].forEach(([v,c])=>{const pts=v.map((y,k)=>[k,y]).filter(p=>p[1]!=null);
   if(pts.length>1)svg.append(el('path',{d:pts.map((p,n)=>`${n?'L':'M'}${X(p[0])} ${Y(p[1])}`).join(' '),stroke:c,'stroke-width':6,class:'draw',pathLength:1,fill:'none'}));
   pts.forEach(p=>{svg.append(el('circle',{cx:X(p[0]),cy:Y(p[1]),r:10,fill:c}),el('text',{x:X(p[0]),y:Y(p[1])-24,class:'tx','text-anchor':'middle',fill:c},p[1].toLocaleString()+' s'))})});
  h.append(svg)},
 break(s){const h=$('.vz',s);h.innerHTML='';const P=DATA.breakeven,W=1640,H=580,svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  const x0=110,x1=W-30,y0=H-70,y1=30,xm=1500,ym=420,X=v=>x0+(x1-x0)*v/xm,Y=v=>y0-(y0-y1)*v/ym,bx=(P.onprem-P.fixed)/P.perVideo;
  svg.append(el('line',{x1:x0,y1:y0,x2:x1,y2:y0,class:'ax'}),el('line',{x1:x0,y1:y1,x2:x0,y2:y0,class:'ax'}));
  [0,500,1000,1500].forEach(v=>svg.append(el('text',{x:X(v),y:H-24,class:'tx','text-anchor':'middle'},v+(v?'':' videos / month'))));
  [0,200,400].forEach(v=>svg.append(el('text',{x:x0-18,y:Y(v)+8,class:'tx','text-anchor':'end'},'$'+v)));
  svg.append(el('path',{d:`M${X(0)} ${Y(P.onprem)} L${X(xm)} ${Y(P.onprem)}`,stroke:'#8B929C','stroke-width':5,class:'draw',pathLength:1}));
  svg.append(el('path',{d:`M${X(0)} ${Y(P.fixed)} L${X(xm)} ${Y(P.fixed+P.perVideo*xm)}`,stroke:'#FF8A2A','stroke-width':6,class:'draw',pathLength:1}));
  svg.append(el('circle',{cx:X(bx),cy:Y(P.onprem),r:13,fill:'#FFC24A'}),el('text',{x:X(bx),y:Y(P.onprem)-34,class:'tx2','text-anchor':'middle'},'≈ '+Math.round(bx).toLocaleString()));
  svg.append(el('text',{x:X(xm),y:Y(P.onprem)+44,class:'tx','text-anchor':'end'},'owned RTX 4090 rig ≈ $'+P.onprem+' a month, flat'));
  svg.append(el('text',{x:X(xm),y:Y(P.fixed+P.perVideo*xm)-22,class:'tx','text-anchor':'end',fill:'#FF8A2A'},'AWS: $'+P.fixed+' fixed + $'+P.perVideo.toFixed(2)+' per video'));
  h.append(svg)},
 sus(s){const D=DATA.sus;$('.sc',s).textContent=D.score==null?'[TBD]':D.score;const d=$('.dots',s);d.innerHTML='';for(let k=0;k<5;k++){const e=document.createElement('i');if(D.success!=null&&k<D.success)e.className='f';d.append(e)}}
};

/* === NAVIGATION === */
function show(n,anim=true){n=Math.max(0,Math.min(S.length-1,n));const prev=S.findIndex(s=>s.classList.contains('active'));if(prev===n)return;
 S.forEach(s=>s.classList.remove('leaving'));
 if(prev>=0&&anim){S[prev].classList.remove('active','go');S[prev].classList.add('leaving');const p=S[prev];setTimeout(()=>p.classList.remove('leaving'),400)}else if(prev>=0)S[prev].classList.remove('active','go');
 S[n].querySelectorAll('[data-viz]').forEach(e=>VIZ[e.dataset.viz]&&VIZ[e.dataset.viz](S[n]));
 S[n].classList.add('active');if(anim){S[n].classList.add('go');scan.classList.remove('go');void scan.offsetWidth;scan.classList.add('go')}
 i=n;hud.innerHTML=S[n].querySelector('template').innerHTML;history.replaceState(0,'','#'+(n+1))}
addEventListener('keydown',e=>{
 if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}else if(['ArrowLeft','PageUp'].includes(e.key))show(i-1);
 else if(e.key=='Home')show(0);else if(/^n$/i.test(e.key))document.body.classList.toggle('notes');else if(/^b$/i.test(e.key))show(S.length-1);
 else if(/^t$/i.test(e.key))t0=Date.now();else if(/^f$/i.test(e.key))document.documentElement.requestFullscreen?.()});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(i+(d<0?1:-1));sx=null});
addEventListener('resize',fit);
setInterval(()=>{if(t0){const s=Math.floor((Date.now()-t0)/1000);clock.textContent='elapsed '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' / 15:00'}else clock.textContent='press T to start timer'},500);
fit();S.forEach(s=>s.querySelectorAll('[data-viz]').forEach(e=>VIZ[e.dataset.viz]&&VIZ[e.dataset.viz](s)));show(i,false);
</script></body></html>
